<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sistema de Gestión LDU</title>
  <link rel="stylesheet" href="CSS/tokens.css?v=20260821-v10">
  <link rel="stylesheet" href="CSS/components.css?v=20260821-v10">
  <link rel="stylesheet" href="CSS/responsive.css?v=20260821-v10">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">LDU</span>
        <div>
          <strong>Sistema de Gestión</strong>
          <small>Dispositivos móviles</small>
        </div>
      </div>
      <nav id="main-nav"></nav>
      <div class="sidebar-footer">Versión modular 1.0</div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div>
          <p class="eyebrow">CONTROL CENTRAL</p>
          <h1 id="page-title">Dashboard</h1>
        </div>
        <span id="connection-status" class="status-pill">Demo local</span>
      </header>
      <section id="app" class="page"></section>
    </main>
  </div>

  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script src="js/config.js?v=20260821-v10"></script>
  <script src="js/api-client.js?v=20260821-v10"></script>
  <script src="js/components.js?v=20260821-v10"></script>
  <script src="js/app.js?v=20260821-v10"></script>

  <script>
    (function () {
      'use strict';

      function restoreNames() {
        document.querySelectorAll('#main-nav a, #main-nav button').forEach(function (item) {
          var original = item.textContent.replace(/\s+/g, ' ').trim();
          var text = original.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
          var label = null;

          if (text.includes('panel') || text === 'dashboard') label = '🏠 Dashboard';
          else if (text.includes('existencias') || text === 'stock') label = '📦 Stock';
          else if (text.includes('imei histor') || text.includes('historial imei')) label = '📋 Historial IMEI';
          else if (text.includes('importar')) label = '📥 Importar Masivo';
          else if (text.includes('notificacion')) label = '🔔 Notificaciones';
          else if (text.includes('buscador')) label = '🔍 Buscador';
          else if (text.includes('eliminar')) label = '🗑️ Eliminar';
          else if (text.includes('sin actualizar')) label = '⏱️ IMEIs sin Actualizar';
          else if (text.includes('usuario')) label = '👥 Usuarios';
          else if (text.includes('configuracion')) label = '⚙️ Configuración';
          else if (text.includes('inventario ldu')) label = '📱 Inventario LDU';
          else if (text.includes('incidencia')) label = '⚠️ Incidencias';
          else if (text.includes('modelos ant. a') || text.includes('modelos antiguos a')) label = '🟦 Modelos Ant. A';
          else if (text.includes('modelos ant. b') || text.includes('modelos antiguos b')) label = '🟧 Modelos Ant. B';

          if (label && original !== label) item.textContent = label;
        });

        var title = document.getElementById('page-title');
        if (title && title.textContent.trim().toLowerCase() === 'panel') title.textContent = 'Dashboard';
      }

      function init() {
        restoreNames();
        new MutationObserver(restoreNames).observe(document.body, { childList: true, subtree: true });
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init, { once: true });
      } else {
        init();
      }
    }());
  </script>
</body>
</html>
